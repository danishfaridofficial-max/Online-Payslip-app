name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with this APK'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Restore Keystore & Secrets
        env:
          CUSTOM_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          CUSTOM_STORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          CUSTOM_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          CUSTOM_KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          touch .env
          if [ -n "$CUSTOM_KEYSTORE_BASE64" ]; then
            echo "$CUSTOM_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${CUSTOM_STORE_PASS:-android}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${CUSTOM_KEY_ALIAS:-androiddebugkey}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${CUSTOM_KEY_PASS:-android}" >> $GITHUB_ENV
            echo "Custom release keystore restored from GitHub Secret"
          elif [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/debug.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            echo "Persistent keystore restored from debug.keystore.base64"
          elif [ -f "debug.keystore" ]; then
            echo "Using existing debug.keystore"
          else
            echo "Error: Keystore file missing! Keystore must be preserved to prevent signature mismatch."
            exit 1
          fi

      - name: Build Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-release
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            # Fallback if release not found
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" build-release/OnlinePayslip.apk
            cp "$APK_PATH" build-release/OnlinePayslip-v1.0.apk
            cp "$APK_PATH" build-release/app-release.apk
            echo "Release APK ready at build-release/OnlinePayslip.apk"
          else
            echo "APK file not found!" && exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnlinePayslip-APK
          path: build-release/OnlinePayslip.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Online Payslip v1.0 (Build ${{ github.run_number }})
          make_latest: true
          body: |
            ### Online Payslip Android APK
            
            Automatic Build from GitHub Actions.
            - Build: ${{ github.run_number }}
            - Features: Official HRMIS Login, Real Firebase Messaging, Unity Ads Rewarded Flow, Live Traffic & PDF Export.
            
            Download APK: Click below under Assets to download OnlinePayslip.apk directly to your phone.
          files: |
            build-release/OnlinePayslip.apk
            build-release/OnlinePayslip-v1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
